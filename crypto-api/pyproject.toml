[tool.poetry]
name = "crypto-api"
version = "0.1.0"
description = "Crypto research API - Django + DRF + Postgres, TokenAuth, no Celery/Redis"
readme = "README.md"
package-mode = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 180

[tool.black]
line-length = 180

[tool.isort]
profile = "black"
line_length = 180

[tool.poetry.dependencies]
python = "^3.12"
Django = "^5.2.7"
django-configurations = "^2.5.1"
djangorestframework = "^3.15.2"
django-filter = "^24.3"
django-cors-headers = "^4.6.0"
django-structlog = "^8.1.0"
whitenoise = "^6.8.2"
gunicorn = "^23.0.0"
psycopg2-binary = "^2.9.10"
python-dotenv = "^1.0.1"
pillow = "^11.0.0"
requests = "^2.32.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
pytest-django = "^4.9.0"
ruff = "^0.8.4"
ipython = "^8.31.0"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.develop"
DJANGO_CONFIGURATION = "Develop"
pythonpath = ["api"]
django_find_project = false
python_files = ["test_*.py", "tests.py"]
